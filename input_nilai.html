<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SMAN 10 Tasikmalaya</title>
  <link rel="icon" type="image/png" href="images/logo.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="input_nilai">

  <header class="Doniza_topbar">
    <div class="Doniza_topbar_left">
      <button id="Doniza_menuBtn" class="Doniza_menu_btn" aria-label="Buka/tutup menu"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <span class="Doniza_brand">SMAN 10 TASIKMALAYA</span>
    </div>
    <div class="Doniza_topbar_user">
      <span class="Doniza_d_none_sm">Administrator</span>
      <div class="Doniza_avatar">AD</div>
    </div>
  </header>

  <div class="Doniza_layout">
    <aside id="Doniza_sidebar" class="Doniza_sidebar">
      <nav>
        <a href="index.html" class="Doniza_nav_link">
          <i class="fa-solid fa-house"></i>
          <span>Dashboard</span>
        </a>
        <a href="siswa.html" class="Doniza_nav_link">
          <i class="fa-solid fa-users"></i>
          <span>Siswa</span>
        </a>
        <a href="guru.html" class="Doniza_nav_link">
          <i class="fa-solid fa-user-tie"></i>
          <span>Guru</span>
        </a>
        <a href="jadwal.html" class="Doniza_nav_link">
          <i class="fa-solid fa-calendar-days"></i>
          <span>Jadwal</span>
        </a>
        <a href="absensi.html" class="Doniza_nav_link">
          <i class="fa-solid fa-square-check"></i>
          <span>Absensi</span>
        </a>
        <a href="nilai.html" class="Doniza_nav_link Doniza_active">
          <i class="fa-solid fa-chart-simple"></i>
          <span>Nilai</span>
        </a>
        <a href="laporan.html" class="Doniza_nav_link">
          <i class="fa-solid fa-file-lines"></i>
          <span>Laporan</span>
        </a>
        <a href="kontak.html" class="Doniza_nav_link">
          <i class="fa-solid fa-envelope"></i>
          <span>Kontak</span>
        </a>
      </nav>
      <a href="login.html" class="Doniza_nav_link Doniza_nav_logout">
        <i class="fa-solid fa-right-from-bracket"></i>
        <span>Logout</span>
      </a>
    </aside>

    <main class="Doniza_content Doniza_narrow">
      <a href="nilai.html" class="Doniza_back_link"><i class="fa-solid fa-arrow-left"></i> <span>Kembali ke Data Nilai</span></a>
      <h1 class="Doniza_page_title">Tambah Nilai Siswa Baru</h1>

      <div id="Doniza_notif"></div>

      <div class="Doniza_card Doniza_card_pad" style="border-color:#e5e7eb">
        <form id="Doniza_formInputNilai" class="Doniza_form_stack Doniza_form_lg">

          <div class="Doniza_form_group">
            <label>Nama Siswa</label>
            <select id="Doniza_selectSiswa" name="nis_siswa" class="Doniza_field" required></select>
          </div>

          <div class="Doniza_grid_form_2">
            <div class="Doniza_form_group">
              <label>Kelas</label>
              <select id="Doniza_selectKelas" name="id_kelas" class="Doniza_field" required></select>
            </div>
            <div class="Doniza_form_group">
              <label>Mata Pelajaran</label>
              <select id="Doniza_selectMapel" name="id_mapel" class="Doniza_field" required></select>
            </div>
          </div>

          <div class="Doniza_form_group">
            <label>Semester</label>
            <input type="text" name="semester" class="Doniza_field" placeholder="Contoh: 2026/2027 Ganjil" required>
          </div>

          <div class="Doniza_score_box">
            <div class="Doniza_form_group"><label>Nilai Tugas</label><input type="number" name="tugas" class="Doniza_field" min="0" max="100" placeholder="0" required></div>
            <div class="Doniza_form_group"><label>Nilai UTS</label><input type="number" name="uts" class="Doniza_field" min="0" max="100" placeholder="0" required></div>
            <div class="Doniza_form_group"><label>Nilai UAS</label><input type="number" name="uas" class="Doniza_field" min="0" max="100" placeholder="0" required></div>
          </div>

          <button type="submit" class="Doniza_btn Doniza_btn_dark Doniza_btn_block">
            <i class="fa-solid fa-floppy-disk"></i> Simpan Data Nilai
          </button>
        </form>
      </div>
    </main>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
