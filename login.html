<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SMAN 10 Tasikmalaya</title>
  <link rel="icon" type="image/png" href="images/logo.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="Doniza_login_body" data-page="login">

  <div class="Doniza_login_card">

    <div class="Doniza_login_head">
      <div class="Doniza_login_logo">
        <img src="images/logo.png" alt="Logo SMAN 10 Tasikmalaya">
      </div>
      <h1>Sistem Informasi Sekolah</h1>
      <h2>SMAN 10 TASIKMALAYA</h2>
      <p>Silahkan login untuk masuk ke sistem</p>
    </div>

    <form id="Doniza_formLogin" class="Doniza_login_form" action="index.html">

      <div class="Doniza_input_icon">
        <i class="fa-solid fa-user"></i>
        <input type="text" name="username" placeholder="Username" required>
      </div>

      <div class="Doniza_input_icon">
        <i class="fa-solid fa-lock"></i>
        <input type="password" name="password" placeholder="Password" required>
      </div>

      <div class="Doniza_login_row">
        <label>
          <input type="checkbox" name="remember" checked>
          <span>Ingat saya</span>
        </label>
        <a href="kontak.html">Lupa Password?</a>
      </div>

      <button type="submit" class="Doniza_btn_login">Login</button>
    </form>

    <div class="Doniza_login_foot">
      Belum punya akun? <a href="kontak.html">Hubungi admin sekolah</a>
    </div>

  </div>

  <script src="js/app.js"></script>
</body>
</html>
