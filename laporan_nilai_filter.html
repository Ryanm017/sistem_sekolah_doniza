<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SMAN 10 Tasikmalaya</title>
  <link rel="icon" type="image/png" href="images/logo.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="laporan_nilai">

  <header class="Doniza_topbar">
    <div class="Doniza_topbar_left">
      <button id="Doniza_menuBtn" class="Doniza_menu_btn" aria-label="Buka/tutup menu"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <span class="Doniza_brand">SMAN 10 TASIKMALAYA</span>
    </div>
    <div class="Doniza_topbar_user">
      <span class="Doniza_d_none_sm">Administrator</span>
      <div class="Doniza_avatar">AD</div>
    </div>
  </header>

  <div class="Doniza_layout">
    <aside id="Doniza_sidebar" class="Doniza_sidebar">
      <nav>
        <a href="index.html" class="Doniza_nav_link">
          <i class="fa-solid fa-house"></i>
          <span>Dashboard</span>
        </a>
        <a href="siswa.html" class="Doniza_nav_link">
          <i class="fa-solid fa-users"></i>
          <span>Siswa</span>
        </a>
        <a href="guru.html" class="Doniza_nav_link">
          <i class="fa-solid fa-user-tie"></i>
          <span>Guru</span>
        </a>
        <a href="jadwal.html" class="Doniza_nav_link">
          <i class="fa-solid fa-calendar-days"></i>
          <span>Jadwal</span>
        </a>
        <a href="absensi.html" class="Doniza_nav_link">
          <i class="fa-solid fa-square-check"></i>
          <span>Absensi</span>
        </a>
        <a href="nilai.html" class="Doniza_nav_link">
          <i class="fa-solid fa-chart-simple"></i>
          <span>Nilai</span>
        </a>
        <a href="laporan.html" class="Doniza_nav_link Doniza_active">
          <i class="fa-solid fa-file-lines"></i>
          <span>Laporan</span>
        </a>
        <a href="kontak.html" class="Doniza_nav_link">
          <i class="fa-solid fa-envelope"></i>
          <span>Kontak</span>
        </a>
      </nav>
      <a href="login.html" class="Doniza_nav_link Doniza_nav_logout">
        <i class="fa-solid fa-right-from-bracket"></i>
        <span>Logout</span>
      </a>
    </aside>

    <main class="Doniza_content Doniza_center_col">
      <div class="Doniza_spec_card">
        <div class="Doniza_spec_head">
          <div class="Doniza_ico"><i class="fa-solid fa-graduation-cap"></i></div>
          <div>
            <h1>Spesifikasi Cetak Rapor / Nilai</h1>
            <p>Tentukan nama siswa beserta cakupan semester nilai.</p>
          </div>
        </div>
        <div class="Doniza_spec_body">
          <div class="Doniza_form_group">
            <label>Pilih Siswa</label>
            <input type="text" id="Doniza_pilihSiswa" class="Doniza_field" list="Doniza_daftarSiswa" placeholder="-- Ketik Nama, NIS atau Kelas Siswa --" autocomplete="off">
            <datalist id="Doniza_daftarSiswa"></datalist>
          </div>
          <div class="Doniza_form_group">
            <label>Cakupan Rekap Semester</label>
            <select id="Doniza_cakupan_semester" class="Doniza_field">
              <option value="semua">Semua Semester (Transkrip Kumulatif)</option>
              <option value="ganjil">Semester Ganjil Saja</option>
              <option value="genap">Semester Genap Saja</option>
            </select>
          </div>
          <div class="Doniza_form_group" id="Doniza_box_ta">
            <label>Tahun Ajaran</label>
            <select id="Doniza_tahun_ajaran" class="Doniza_field"><option value="2025/2026">2025/2026</option><option value="2026/2027" selected>2026/2027</option></select>
          </div>
          <div class="Doniza_spec_foot">
            <a href="laporan.html" class="Doniza_btn Doniza_btn_light" style="font-size:12px;padding:10px 16px;border-radius:12px">Kembali</a>
            <button type="button" id="Doniza_btnCetak" class="Doniza_btn Doniza_btn_primary Doniza_btn_sm">
              <i class="fa-solid fa-print"></i> <span>Buka Lembar Cetak</span>
            </button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
